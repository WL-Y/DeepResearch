name: Bug report
description: 报告可复现的软件问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先搜索已有 Issue，并删除日志中的密钥、个人数据和完整研究内容。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 输入……
        3. 观察到……
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: 版本或提交
      placeholder: commit SHA 或分支名称
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python、Node.js、浏览器及相关非敏感配置。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 可提供已脱敏日志、截图或最小示例。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue。
          required: true
        - label: 我确认内容不含 API Key、令牌或私人数据。
          required: true
